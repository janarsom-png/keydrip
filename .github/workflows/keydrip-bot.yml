name: The Vault Thief bot

# CADENCE
#   Pre-launch (secret TOKEN_MINT not set): a quick run that only publishes the site (teaser at the root, full game at
#   the secret /p/<PREVIEW_SLUG>/ preview) via the "Publish site" workflow. No loop, no minutes burned.
#
#   Live game (TOKEN_MINT set): ONE long-running job ticks about EVERY 60 SECONDS (bot/ci-loop.js -> bot/run.js):
#   samples market cap (milestones fire on the first tick over the threshold), opens time-locked glyphs whose drand
#   deadline has passed (no secret needed), scans for a winning sweep, rebuilds site/reveals.json + site/feed.json +
#   X drafts. When something meaningful changes it commits + pushes at once and dispatches "Publish site" to redeploy
#   Pages (plus a 10-minute heartbeat so the prize pool / timestamp stay fresh).
#   GitHub jobs are capped at 6 h, so the loop runs ~5h40m, then dispatches a fresh run of this workflow and exits;
#   the concurrency group queues the successor until the old run is done, so two loops never overlap.
#   The loop stops for good when the game is over (winner found, or 2 h past the final deadline, which
#   lib/schedule.js caps at maxGameHours = 24 h after launch).
#   The */5 cron below is only a BACKUP restarter: GitHub throttles it heavily (often hours apart), so it is never
#   relied on for timing. To stop the loop by hand, cancel the running workflow run (a cancelled run hands over to no one).
#
# It NEVER posts to X and NEVER sends an on-chain transaction. Drafts are text files only. Secrets are never printed.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   TOKEN_MINT            the pump.fun mint address. Setting it switches the bot from pre-launch to live-game mode.
#   THIEF_SECRET_B64      optional - base64 of secrets/secret.json. Enables MILESTONE-EARLY reveals and the
#                         final full-key reveal on win. Omit it to run the fully trustless time-locked path:
#                         glyphs still open at their drand deadlines without any secret.
#                         Trust note: whoever holds this secret can reveal early. Prefer running the
#                         milestone path on your own machine (bot/loop.js) if you don't want GitHub to hold it.
#   PREVIEW_SLUG          secret preview path (used by "Publish site").
# Variable: LAUNCHED = true publishes the full game at the root (used by "Publish site").

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

# One bot run at a time. A new run (successor / cron) WAITS in the queue; it never cancels the running loop.
concurrency:
  group: keydrip-bot
  cancel-in-progress: false

jobs:
  mode:
    runs-on: ubuntu-latest
    outputs:
      live: ${{ steps.m.outputs.live }}
    steps:
      - id: m
        env:
          TOKEN_MINT: ${{ secrets.TOKEN_MINT }}
        run: |
          if [ -n "$TOKEN_MINT" ]; then echo "live=true" >> "$GITHUB_OUTPUT"; echo "TOKEN_MINT is set -> live-game loop."
          else echo "live=false" >> "$GITHUB_OUTPUT"; echo "TOKEN_MINT not set (token not launched) -> pre-launch publish only."; fi

  # Pre-launch: publish teaser + private preview, exactly as before.
  publish:
    needs: mode
    if: needs.mode.outputs.live != 'true'
    uses: ./.github/workflows/pages.yml
    secrets: inherit

  # Live game: tick every ~60 s for up to ~5h40m, then hand over to a fresh run.
  loop:
    needs: mode
    if: needs.mode.outputs.live == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - name: Tick every 60 s (commit + redeploy on change)
        id: loop
        env:
          TOKEN_MINT: ${{ secrets.TOKEN_MINT }}
          THIEF_SECRET_B64: ${{ secrets.THIEF_SECRET_B64 }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          git config user.name "keydrip-bot"
          git config user.email "bot@users.noreply.github.com"
          node bot/ci-loop.js --mint "$TOKEN_MINT" --duration-min 340 --interval-sec 60 --heartbeat-min 10 \
            --exit-file "$RUNNER_TEMP/loop-exit.json"
      - name: Hand over to a fresh run (keeps the 60 s cadence past the 6 h job limit)
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          START: ${{ steps.loop.outputs.start }}
        run: |
          reason=$(node -e 'try{console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).reason)}catch{console.log("none")}' "$RUNNER_TEMP/loop-exit.json")
          ran=$(( $(date +%s) - ${START:-$(date +%s)} ))
          echo "loop exit reason: $reason (ran ${ran}s)"
          if [ "$reason" = "over" ]; then echo "Game over -> no successor. The loop has stopped."; exit 0; fi
          if [ "$reason" != "duration" ] && [ "$ran" -lt 600 ]; then
            echo "::warning::Loop failed after only ${ran}s -> not re-dispatching (avoids a crash loop); the */5 cron will retry."
            exit 0
          fi
          gh workflow run keydrip-bot.yml --ref main && echo "Successor dispatched; it starts as soon as this run ends."
